<div class="container mt-4">
  <h2>Products</h2>
  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let product of products">
      <div class="card h-100">
        <img *ngIf="product.image"
             [src]="product.image"
             class="card-img-top"
             alt="{{ product.name }}"
             style="max-height: 200px; object-fit: contain;" />

        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">{{ product.description }}</p>
          <p><strong>Price:</strong> {{ product.price }} TND</p>
          <p><strong>Stock:</strong> {{ product.stock }}</p>
        </div>

        <div class="card-footer text-center">
          <button class="btn btn-primary me-2" (click)="onEdit(product.id)">Update</button>
          <button class="btn btn-danger" (click)="onDelete(product.id)">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>
