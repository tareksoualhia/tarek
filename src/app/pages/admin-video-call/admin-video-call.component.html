<div class="video-call-container">
  <h2>🎥 Assistance Vidéo (Admin)</h2>

  <div *ngIf="message" class="status">{{ message }}</div>

  <div class="video-wrapper">
    <video #localVideo autoplay muted playsinline></video>
    <video #remoteVideo autoplay playsinline></video>
  </div>

  <button (click)="startCall()" [disabled]="loading || !isPeerReady">
    {{ loading ? '⏳ Connexion...' : '📞 Démarrer l’appel' }}
  </button>
</div>
<button (click)="disconnectCall()" [disabled]="!isPeerReady">
  🔴 Déconnexion
</button>
